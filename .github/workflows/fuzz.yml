name: fuzz

# Weekly fuzzing of the untrusted-input surface (ROM parsing → system
# construction, and save-state loading). Short per-target budgets: this is a regression net that
# re-explores from the committed corpus, not a discovery campaign — for
# that, run `cargo +nightly fuzz run <target>` locally for hours.
#
# A crash fails the job AND uploads the reproducer artifact, so the input
# can be replayed with `cargo fuzz run <target> artifacts/<target>/<file>`.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after tom-harte
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        required: false
        default: "5"
  # Releases are fast-forwards of main (no pull request), so a change to the
  # fuzzed surface is also fuzzed when it lands on develop.
  push:
    branches: [develop]
    paths:
      # The untrusted-input surface the targets drive: ROM parsing, and
      # the save-state decoders (luna-api's bundle, each mapper's blob, the
      # DSP-1 core's blob, the `Snes` tree itself). State that lives in the
      # PPU, APU and the two CPU crates is not listed: the weekly run is
      # the backstop for those.
      - "crates/luna-cartridge/**"
      - "crates/luna-bus/src/**"
      - "crates/luna-cpu-upd96050/src/**"
      - "crates/luna-core/src/coproc/**"
      - "crates/luna-core/src/snes.rs"
      - "crates/luna-api/src/lib.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      # The untrusted-input surface the targets drive: ROM parsing, and
      # the save-state decoders (luna-api's bundle, each mapper's blob, the
      # DSP-1 core's blob, the `Snes` tree itself). State that lives in the
      # PPU, APU and the two CPU crates is not listed: the weekly run is
      # the backstop for those.
      - "crates/luna-cartridge/**"
      - "crates/luna-bus/src/**"
      - "crates/luna-cpu-upd96050/src/**"
      - "crates/luna-core/src/coproc/**"
      - "crates/luna-core/src/snes.rs"
      - "crates/luna-api/src/lib.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # cargo-fuzz needs nightly (`-Zsanitizer`). rust-toolchain.toml pins
    # another channel and would win for every cargo/rustc call made inside
    # the checkout (rust-cache's key, `cargo install`, cargo-fuzz's inner
    # `cargo build`) — and get installed as a second toolchain. Forcing
    # nightly for the whole job keeps it to the one installed below.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [cartridge_parse, cartridge_forced, cartridge_to_system, load_state]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        run: |
          MINUTES="${{ github.event.inputs.minutes || '5' }}"
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time=$((MINUTES * 60)) -rss_limit_mb=4096
      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
