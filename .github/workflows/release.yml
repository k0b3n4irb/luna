name: Release

# Build and publish runnable binaries when a version tag is pushed.
# Native build per target — no cross-compilation:
#   - Linux   x86_64 (ubuntu-latest)
#   - Linux   arm64  (ubuntu-24.04-arm, free arm64 runner: public repo)
#   - Windows x86_64 (windows-latest)
#   - macOS   arm64  (macos-14, Apple Silicon)
# One zip per platform, `luna_<tag>_<os>_<arch>.zip`, the OpenSNES layout
# (`opensnes_<tag>_<os>_<arch>.zip`): one file to pick, Explorer opens it,
# GitHub shows its digest on the release page. The auto-generated source
# archives stay; these zips attach alongside them.
on:
  push:
    tags:
      - "v*"
  # Rebuild an existing tag's release in the current layout (the zips are
  # built from the tag's own sources; the notes come from this ref's
  # CHANGELOG.md). Used on 2026-10-05 to redo the kept releases.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.33.1"
        required: true
        type: string

# Needed by softprops/action-gh-release to create the release + upload assets.
permissions:
  contents: write

env:
  # The tag being released: the pushed one, or the one given to a dispatch.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # actions/cache still ships a Node 20 entrypoint; opt into Node 24 (see ci.yml).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Every action here is pinned to a full commit SHA (tag in the trailing
# comment): this workflow holds `contents: write` and publishes binaries
# people download, so a moved tag upstream must not be able to change what
# runs. Bump deliberately — `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
jobs:
  # ---------------------------------------------------------------------
  # Build both binaries (`luna` CLI + `luna-gui`) natively per platform
  # and package each with LICENSE + README into one zip.
  # ---------------------------------------------------------------------
  build:
    name: build ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: x86_64
          - runner: macos-14
            os: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Linux's only build-time system dep for both binaries: ALSA headers
      # (cpal → alsa-sys). winit/wgpu dlopen X11/Wayland/Vulkan at runtime; rfd
      # brings no GTK or D-Bus crate (its Linux dependencies in Cargo.lock are
      # the pure-Rust wayland-* crates) — no GTK build dep. Windows (WASAPI)
      # and macOS (CoreAudio) need no extra system package; cpal links the OS
      # audio framework directly.
      - name: Install ALSA headers
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build release binaries
        run: cargo build --release --locked -p luna-cli -p luna-gui

      # One bash step for every platform — Git Bash is on PATH on the Windows
      # runner. `zip` is on the Linux and macOS images, `7z` on Windows.
      - name: Package zip
        shell: bash
        run: |
          set -euo pipefail
          PKG="luna_${RELEASE_TAG}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "dist/${PKG}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp target/release/luna.exe target/release/luna-gui.exe "dist/${PKG}/"
          else
            cp target/release/luna target/release/luna-gui "dist/${PKG}/"
          fi
          cp LICENSE README.md "dist/${PKG}/"
          if command -v zip >/dev/null 2>&1; then
            ( cd dist && zip -qr "${PKG}.zip" "${PKG}" )
          else
            ( cd dist && 7z a -tzip "${PKG}.zip" "${PKG}" >/dev/null )
          fi
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luna-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Collect every platform's artifacts and publish them to the GitHub
  # release for this tag (created if absent), next to the source archives.
  # ---------------------------------------------------------------------
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only for CHANGELOG.md and the notes script; the binaries come from
      # `build`. On a dispatch this is the branch the run was started from,
      # whose changelog holds every version's section.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      # The release page is titled `luna vX.Y.Z` and its body is this
      # version's CHANGELOG.md section plus the download table. The step fails
      # when the changelog has no section for the tag, so a release can never
      # go out with empty notes. An RC tag shows its final version's section.
      - name: Release notes from CHANGELOG.md
        run: tools/release-notes.py "$RELEASE_TAG" > release_notes.md

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: luna ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          files: dist/*
          fail_on_unmatched_files: true
          # Pre-release semver tags (a hyphen: v1.0.0-rc1, -beta…) publish as
          # a GitHub pre-release so they never become the "latest" stable
          # release; clean tags (v1.0.0) publish as a full release.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
