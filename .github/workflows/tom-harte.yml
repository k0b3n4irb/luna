name: Tom Harte CPU suites

# The exhaustive SingleStepTests instruction-semantics gate for both CPU
# cores. The 65C816 release run of 5.08M cases is ~8 min locally but ~25 min
# on GitHub's 2-core runners, so it's NOT part of the per-push `CI` workflow.
# It runs by itself on any push to `develop` or pull request that touches a
# CPU core (luna-cpu-65c816 / luna-cpu-spc700) or the test bus they run on,
# weekly on the released code, and on demand (Actions → this workflow →
# "Run workflow").
#
# These tests are #[ignore] by default and need large external datasets.
# LUNA_TOM_HARTE_REQUIRE=1 turns any mismatch into a hard failure.
#
# Datasets are large external shallow clones (not committed): fetched on a
# cache miss and cached across runs, keyed on the corresponding fetch script.
#   - 65C816  → tests/tom-harte/v1         (tools/fetch-tom-harte.sh)
#   - SPC700  → tests/tom-harte-spc700/v1  (tools/fetch-tom-harte-spc700.sh)

on:
  workflow_dispatch:
  # Weekly safety net: scheduled runs execute on the DEFAULT branch (main),
  # i.e. the released code — deliberate.
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  # Automatic gate on any PR touching a CPU core: a semantics regression
  # must not be mergeable with a green CI. The datasets are cached, so
  # this costs runner time (~25 min) only on the PRs that need it.
  pull_request:
    paths:
      - "crates/luna-cpu-65c816/**"
      - "crates/luna-cpu-spc700/**"
      # The 65C816 harness runs on luna-bus' `RamBus` (testing.rs), which is
      # built on the `Bus` trait (bus.rs) and `Addr24` / `MCycles` (types.rs).
      - "crates/luna-bus/src/testing.rs"
      - "crates/luna-bus/src/bus.rs"
      - "crates/luna-bus/src/types.rs"
      - "tools/fetch-tom-harte.sh"
      - "tools/fetch-tom-harte-spc700.sh"
      - ".github/workflows/tom-harte.yml"
  # Most commits are pushed straight to `develop` with no pull request, and
  # a release is a fast-forward of main: without this trigger a CPU-core
  # change would first meet the suites on the Monday after its release.
  push:
    branches: [develop]
    paths:
      - "crates/luna-cpu-65c816/**"
      - "crates/luna-cpu-spc700/**"
      # The 65C816 harness runs on luna-bus' `RamBus` (testing.rs), which is
      # built on the `Bus` trait (bus.rs) and `Addr24` / `MCycles` (types.rs).
      - "crates/luna-bus/src/testing.rs"
      - "crates/luna-bus/src/bus.rs"
      - "crates/luna-bus/src/types.rs"
      - "tools/fetch-tom-harte.sh"
      - "tools/fetch-tom-harte-spc700.sh"
      - ".github/workflows/tom-harte.yml"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  # actions/cache@v6 still ships a Node.js 20 entrypoint (deprecated). Opt
  # into Node 24 now to clear the runner warning (github.blog 2025-09-19).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tom-harte:
    name: tom-harte (cpu suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: tom-harte
      - name: Cache 65C816 Tom Harte dataset
        id: snes-cache
        uses: actions/cache@v6
        with:
          path: tests/tom-harte/v1
          key: tom-harte-65816-${{ hashFiles('tools/fetch-tom-harte.sh') }}
      - name: Fetch 65C816 dataset (on cache miss)
        if: steps.snes-cache.outputs.cache-hit != 'true'
        run: tools/fetch-tom-harte.sh
      - name: Cache SPC700 Tom Harte dataset
        id: spc-cache
        uses: actions/cache@v6
        with:
          path: tests/tom-harte-spc700/v1
          key: tom-harte-spc700-${{ hashFiles('tools/fetch-tom-harte-spc700.sh') }}
      - name: Fetch SPC700 dataset (on cache miss)
        if: steps.spc-cache.outputs.cache-hit != 'true'
        run: tools/fetch-tom-harte-spc700.sh
      - name: SPC700 suite (strict)
        env:
          LUNA_TOM_HARTE_REQUIRE: "1"
        run: cargo test -p luna-cpu-spc700 --test tom_harte --release -- --ignored --nocapture
      - name: 65C816 suite (strict)
        env:
          LUNA_TOM_HARTE_REQUIRE: "1"
        run: cargo test -p luna-cpu-65c816 --test tom_harte --release -- --ignored --nocapture
