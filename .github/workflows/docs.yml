name: docs

# Builds the mdBook guide + the rustdoc API reference and publishes the
# combined site to GitHub Pages via the native Actions deployment
# (upload-pages-artifact + deploy-pages) — guide at /, API under /api.

on:
  push:
    branches: [develop, main]
    paths:
      - "book/**"
      - "crates/**/*.rs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"

      - name: Build the guide
        run: mdbook build book

      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: System deps (libasound for the workspace)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Build the rustdoc API reference
        run: cargo doc --workspace --no-deps

      - name: Assemble the site (guide at /, API under /api)
        run: |
          mkdir -p public
          cp -r book/book/* public/
          mkdir -p public/api
          cp -r target/doc/* public/api/
          # /api lands on the public-contract crate.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=luna_api/index.html">' > public/api/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
