name: CI

on:
  # CI runs continuously on `develop` (the integration branch) and on every
  # pull request. `main` is NOT a push trigger: a release is a fast-forward
  # push of a `develop` commit whose CI is already green (`git push origin
  # develop:main`, see .claude/rules/no-co-authored-by.md), so a re-run on main
  # would test the same commit twice.
  push:
    branches: [develop]
  pull_request:

# Cancel older runs of the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # missing_docs is a warning in the workspace lints; -D warnings turns it
  # (and any other warning) into a hard error in CI.
  RUSTFLAGS: "-D warnings"
  # Reduce noise from incremental compilation when caches are warm.
  CARGO_INCREMENTAL: "0"
  # actions/cache@v6 still ships a Node.js 20 entrypoint (deprecated; forced
  # to Node 24 by the runner from 2026-06-16). Opt into Node 24 now to clear
  # the deprecation warning. See github.blog/changelog/2025-09-19.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------
  # cargo check on the host (Linux x86_64). Catches any warning as error.
  # `--locked` fails the job when Cargo.lock is out of step with the
  # manifests; the release build of the two shipped binaries is the same
  # command release.yml runs at tag time, so a release-only break (or a
  # stale lock) shows here and not on the tag.
  # ---------------------------------------------------------------------
  check:
    name: check (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (cpal → alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - name: Build release binaries (as release.yml does)
        run: cargo build --release --locked -p luna-cli -p luna-gui

  # ---------------------------------------------------------------------
  # cargo test on the host.
  # ---------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (cpal → alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # NOTE: this also runs the `snes_test_roms` golden binary WITHOUT a
      # corpus, so its ~90 tests print "[skip]" and pass in 0.00s — they
      # verify nothing here. The real golden gate is the `snes-test-roms`
      # job below, which fetches the corpus and sets LUNA_SNES_TEST_REQUIRE.
      - run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------
  # cargo check on wasm32-unknown-unknown for every cross-target crate.
  #
  # Native-only, not checked here: luna-mcp-server, luna-cli (binary) and
  # luna-gui (winit / pixels / cpal). The nine other crates — the emulation
  # core and luna-api — MUST build for wasm32 or the design is broken.
  # ---------------------------------------------------------------------
  wasm-check:
    name: check (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for,
      # the wasm32-unknown-unknown target included.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: |
          cargo check --target wasm32-unknown-unknown \
            -p luna-bus \
            -p luna-cpu-65c816 \
            -p luna-cpu-spc700 \
            -p luna-cpu-upd96050 \
            -p luna-ppu \
            -p luna-apu \
            -p luna-cartridge \
            -p luna-core \
            -p luna-api

  # ---------------------------------------------------------------------
  # Formatting (cargo fmt --check).
  # ---------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for,
      # rustfmt included.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      # No automated dependency bots, ever (.claude/rules/no-dependency-bots.md).
      # Lives in this required job so it gates every PR without a settings
      # change. Fails on a bot config file, or on a pull request opened by a bot.
      - name: No dependency bots
        env:
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          found=$(ls -1 .github/dependabot.yml .github/dependabot.yaml \
            renovate.json renovate.json5 .renovaterc .renovaterc.json \
            .github/renovate.json .github/renovate.json5 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::dependency-bot config is not allowed: $found"
            exit 1
          fi
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            echo "::error::pull requests opened by bots are not allowed ($PR_AUTHOR)"
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Lints (cargo clippy with -D warnings on top of workspace lints).
  # `--all-features` matches the local pre-commit gate
  # (.claude/rules/rust-lint-discipline.md) so feature-gated code (today
  # the one feature of the workspace, luna-bus `test-utils`) is linted in
  # CI too.
  # ---------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (cpal → alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for,
      # clippy included.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------
  # Documentation drift. The guide, docs/ and the rules must describe the
  # luna in the tree: tools/check-doc-drift.py compares each documented
  # claim with its subject (links and anchors resolve, every quoted path
  # exists, the workspace version is the CHANGELOG head, every `luna`
  # subcommand and option and every MCP tool is in the guide, a new option
  # in the CHANGELOG has its page). The cli/mcp checks ask the real binary
  # (`--help`, `tools/list`), hence the build. The guide is also built
  # strictly here, so a broken SUMMARY fails the PR and not the Pages
  # deploy (docs.yml runs on push only).
  # ---------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ALSA headers (cpal → alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI the checks interrogate
        run: cargo build --release --locked -p luna-cli
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - name: Build the guide
        run: mdbook build book
      - name: Check the documentation against the tree
        run: python3 tools/check-doc-drift.py

  # ---------------------------------------------------------------------
  # NOTE: the Tom Harte SingleStepTests (both CPU cores) used to run here on
  # every push. They are the exhaustive instruction-semantics gate but the
  # 65C816 run alone is ~25 min on GitHub runners — overkill per push. They
  # now live in a dedicated workflow, `.github/workflows/tom-harte.yml`,
  # which runs by itself on any push to `develop` or pull request touching
  # a CPU core, weekly on `main`, and on demand (Actions → "Tom Harte CPU
  # suites" → Run workflow).
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # SNES test-ROM golden suite (Peter Lemon hardware tests). Following the
  # twvd/siena convention the ROM corpus lives in a sibling checkout
  # (../luna_tests), sparse-cloned on demand. The harness boots each ROM
  # and compares a SHA-256 of the framebuffer to a committed golden hash.
  # ---------------------------------------------------------------------
  snes-test-roms:
    name: snes-test-roms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # An absolute corpus path: actions/cache rejects `../luna_tests`
      # ("Relative pathing '.' and '..' is not allowed"), so the sibling
      # default was never actually cached. The harness + fetch script both
      # honour this variable.
      LUNA_SNES_TEST_DIR: ${{ github.workspace }}/.luna_tests
      # A missing corpus ROM is a FAILURE here, never a silent skip.
      LUNA_SNES_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the only place the toolchain is declared
      # (channel, components, targets). rustup is preinstalled on the runner;
      # with no argument it installs exactly what that file asks for.
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: snes-test-roms
      - name: Cache SNES test-ROM corpus
        id: rom-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.luna_tests
          key: snes-test-roms-${{ hashFiles('tools/fetch-snes-test-roms.sh') }}
      - name: Fetch corpus (on cache miss)
        if: steps.rom-cache.outputs.cache-hit != 'true'
        run: tools/fetch-snes-test-roms.sh
      - name: Run golden suite
        run: cargo test -p luna-core --test snes_test_roms --release
