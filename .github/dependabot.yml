# Weekly dependency freshness + security updates.
# Grouped so routine bumps arrive as one PR per ecosystem, not twenty.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    # Day-to-day integration happens on `develop`; `main` only ever
    # receives release merges. Without this, Dependabot targets the
    # DEFAULT branch (main) and its bumps land there directly — which
    # is exactly what happened on 2026-08-01: four dependency PRs went
    # to main, develop never saw them, and the next develop→main
    # release PR came up CONFLICTING on Cargo.lock.
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # The GUI stack MUST move as a set: egui, egui-wgpu and egui-winit
      # share an `epaint` version, and all three must agree with the wgpu
      # major that `pixels` re-exports. A lone egui-wgpu 0.35 bump against
      # egui 0.34 breaks the type bridge (PR #140, closed 2026-08-01:
      # "expected `epaint::image::ImageDelta`, found `ImageDelta`").
      gui-stack:
        patterns: ["egui", "egui-*", "pixels", "wgpu", "winit"]
      # Everything else: routine minor/patch in one PR.
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["egui", "egui-*", "pixels", "wgpu", "winit"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
