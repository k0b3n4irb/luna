[package]
name = "luna-mcp-server"
description = "MCP server for Luna — native-only (rmcp + tokio). Does NOT build for wasm32-unknown-unknown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
luna-api   = { workspace = true }

rmcp       = { workspace = true }
schemars   = { workspace = true }
base64     = { workspace = true }
serde      = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] } # used by the rmcp::tool macro expansion

# Tokio runtime — we need the multi-thread runtime + io-std for stdio
# transport. The workspace default has `default-features = false`, so
# enable the bits we actually need here.
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "sync"] }

# Protocol contract tests (tests/protocol.rs) drive the server with a REAL
# rmcp client over an in-memory duplex: `client` gives us that peer (the
# binary only ever serves, so it stays out of the production build), and
# `io-util` provides tokio::io::duplex.
[dev-dependencies]
rmcp       = { workspace = true, features = ["client"] }
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "sync"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
