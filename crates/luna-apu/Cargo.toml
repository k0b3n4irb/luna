[package]
name = "luna-apu"
description = "SNES Audio Processing Unit — orchestrates the SPC700 and the DSP audio synth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[features]
default = []
# `Apu::trace_step_one`, the frozen-mailbox trajectory harness entry: it
# steps the SPC700 with the atomic oracle interpreter. Tests only.
atomic-oracle = ["luna-cpu-spc700/atomic-oracle"]

[dependencies]
luna-cpu-spc700 = { workspace = true }
# Save-state: serde derives on APU + DSP state.
serde       = { workspace = true, features = ["std", "derive"] }
serde_bytes = { workspace = true }

[lints]
workspace = true
