[package]
name = "luna-cli"
description = "Luna SNES emulator — the `luna` command-line binary (run / test / state / frames / diff / profile / bench / mcp and the dump subcommands)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true

[[bin]]
name = "luna"
path = "src/main.rs"

[dependencies]
# API-first: the CLI drives the emulator only through luna-api (+ the MCP
# transport). No direct deps on luna-core / luna-ppu / luna-apu / luna-cartridge.
luna-api        = { workspace = true }
luna-mcp-server = { workspace = true }

clap       = { workspace = true }
serde      = { workspace = true }
schemars   = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
toml       = { workspace = true }
toml_edit  = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
